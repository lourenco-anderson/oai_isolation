---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gnb-crc
  namespace: default
spec:
  replicas: 1
  minReadySeconds: 45
  selector:
    matchLabels:
      app: gnb-crc
  template:
    metadata:
      labels:
        app: gnb-crc
        component: gnb
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: gnb-crc
        image: gnb-crc:teste-300e-9-15khz-snr5-vDS-RMS
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 1000m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gnb-crc
  namespace: default
spec:
  selector:
    app: gnb-crc
  ports:
  - port: 8080
    targetPort: 8080
