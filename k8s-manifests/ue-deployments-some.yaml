apiVersion: apps/v1
kind: Deployment
metadata:
  name: ue-descrambling
  namespace: default
spec:
  replicas: 1
  minReadySeconds: 45
  selector:
    matchLabels:
      app: ue-descrambling
  template:
    metadata:
      labels:
        app: ue-descrambling
        component: ue
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: ue-descrambling
        image: oai-ue-descrambling:latest
        imagePullPolicy: Never
        command: ["/bin/sh","-c","/app/oai_isolation nr_descrambling && sleep 90"]
        resources:
          requests:
            cpu: 1000m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ue-descrambling
  namespace: default
spec:
  selector:
    app: ue-descrambling
  ports:
  - port: 8080
    targetPort: 8080
